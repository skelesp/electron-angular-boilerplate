# Dependabot keeps this template current, which is most of its value - an Electron +
# Angular starter is stale within months. Dependabot (rather than Renovate) because it
# needs no app install: anyone who clicks "Use this template" gets it working on their
# fork immediately.
#
# `directory: /` covers the whole npm workspaces monorepo - Dependabot reads the root
# package.json's `workspaces` field and raises PRs for every workspace's manifest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Commit messages here follow Conventional Commits (commitlint runs on a commit-msg hook,
    # see CONTRIBUTING.md). Dependabot commits are made server-side and so never see that hook -
    # this is what keeps them in the same vocabulary as everything else in the log.
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Angular ships its packages in lockstep; separate PRs per package would each fail
      # peer resolution against the others. Same reasoning for the lint/format toolchain
      # and the test toolchain, which are only meaningful upgraded together.
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
          - 'zone.js'
      linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'globals'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - '@playwright/test'
      # electron-builder and electron-updater ship from the same project and share an
      # exactly-pinned builder-util-runtime; upgrading one without the other can mismatch it.
      packaging:
        patterns:
          - 'electron-builder'
          - 'electron-updater'
    ignore:
      # Electron majors move the bundled Node/Chromium ABI, which forces a native rebuild of
      # better-sqlite3 and can break the packaged app. CI does now package and launch the app
      # on all three platforms, which catches most of that - but it builds with --dir and does
      # no code signing, so an installer/signing regression would still slip through. Take
      # these deliberately, with a real `npm run package`.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
      # Angular supports exactly one TypeScript minor at a time: @angular/compiler-cli pins
      # `peerDependencies.typescript` to a `>=x.y <x.y+1` window, and its compiler refuses to
      # build outside it, so a TypeScript major cannot be merged until Angular ships support for
      # it - and typescript is not in the `angular` group above, so when that happens it is
      # bumped by hand alongside the Angular upgrade. See "Dependencies" in CLAUDE.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node majors track Node majors, and the Node that matters here is the one Electron
      # bundles (Electron 44 ships Node 24), not the newest release line - nothing in this repo runs
      # a Node newer than that. A major bump type-checks the main process against APIs no runtime
      # here has, so the call compiles clean and throws in the packaged app. It moves when an
      # Electron major moves, by hand, not on its own. See "Dependencies" in CLAUDE.md.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
