name: Bug report
description: Something in the template is broken or behaves unexpectedly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security vulnerabilities —
        report those privately, see [SECURITY.md](https://github.com/skelesp/electron-angular-boilerplate/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command you ran, and its output if it failed.
      placeholder: |
        1. Fresh clone, `npm install`
        2. `npm run test:e2e`
        3. ...
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      description: >-
        This matters more than usual here — a bug that only appears in a packaged build points
        at a different part of the repo than one in `npm start`.
      options:
        - In development (`npm start`)
        - In a packaged build (`npm run package` / `package:dir`)
        - Both
        - In CI only
        - During install or init (`npm install`, `npm run init`)
        - Somewhere else / not sure
    validations:
      required: true

  - type: checkboxes
    id: workspace
    attributes:
      label: Which workspace
      options:
        - label: '`shared` (the API contract)'
        - label: '`electron-app` (main process, database)'
        - label: '`angular-app` (renderer)'
        - label: '`e2e` (Playwright suite)'
        - label: Tooling — build, packaging, CI, scripts

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15.3 (Apple silicon) / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Node and npm versions
      description: Output of `node -v` and `npm -v`.
      placeholder: node v22.14.0, npm 10.9.2
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or tag
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant terminal output, DevTools console errors, or the main-process log
        (`electron-log` writes to the platform's logs directory).
      render: shell
